name: Validate addon

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua 5.1
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1
      - name: Static repository checks
        run: python3 tools/validate.py
      - name: Lua syntax
        run: |
          find Dusk/WelcomeToMiddleEarth -name '*.lua' -print0 | xargs -0 -n1 luac5.1 -p
